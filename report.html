<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Reporting System - Report Incident</title>
    <link rel="stylesheet" href="css/style.css">
    <link id="theme-css" rel="stylesheet" href="css/theme-vscode-premium.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">CRS</div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="login.html">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="report-container">
            <h1>Report an Incident</h1>
            <form class="report-form">
                <div class="form-group">
                    <label for="incident-type">Incident Type:</label>
                    <select id="incident-type" name="incident-type" required>
                        <option value="">Select an incident type</option>
                        <option value="theft">Theft</option>
                        <option value="vandalism">Vandalism</option>
                        <option value="noise">Noise Disturbance</option>
                        <option value="safety">Safety Concern</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="location">Location:</label>
                    <input type="text" id="location" name="location" required>
                </div>
                <div class="form-group">
                    <label for="date">Date & Time:</label>
                    <input type="datetime-local" id="date" name="date" required>
                </div>
                <div class="form-group">
                    <label for="description">Description:</label>
                    <textarea id="description" name="description" rows="6" required></textarea>
                </div>
                <div class="form-group">
                    <label for="evidence">Upload Evidence (optional):</label>
                    <input type="file" id="evidence" name="evidence">
                </div>
                <button type="submit" class="btn">Submit Report</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Community Reporting System. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/theme-switcher.js"></script>
</body>
</html>
